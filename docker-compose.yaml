services:
  postgres:
    image: postgres:16
    container_name: release-checklist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: releaseuser
      POSTGRES_PASSWORD: releasepassword
      POSTGRES_DB: releasechecklist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: